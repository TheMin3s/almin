    }
    from('LICENSE') { rename { "${it}_almin" } }
}

def adminJar = tasks.register('adminJar', Jar) {
    dependsOn adminModJson
    archiveClassifier = 'admin'
    archiveVersion = project.admin_version
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(adminModJson)
    from(sourceSets.main.output) {
        include(
            'com/schecks/almin/AdminPayloads*.class',
            'com/schecks/almin/AdminVersionPayload*.class',
            'com/schecks/almin/DirListingPayload*.class',
            'com/schecks/almin/ConsoleOpenPayload*.class',
            'com/schecks/almin/WebAdminPayload*.class',
            'com/schecks/almin/NanoOpenPayload*.class',
            'com/schecks/almin/ConsoleLinesPayload*.class',
            'com/schecks/almin/ActivityPayload*.class',
            'com/schecks/almin/PanelPayload*.class',
            'com/schecks/almin/DirRequestPayload*.class',
            'com/schecks/almin/ConsoleSubscribePayload*.class',
            'com/schecks/almin/WebAdminRequestPayload*.class',
            'com/schecks/almin/WebPasswordPayload*.class',
